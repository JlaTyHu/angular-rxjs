<h2 mat-dialog-title>{{ dialogData.description }}</h2>

<mat-dialog-content [formGroup]="courseForm">
  <mat-form-field>
    <input
      matInput
      placeholder="Course Description"
      formControlName="description"
    />
  </mat-form-field>

  <mat-form-field>
    <mat-select
      placeholder="Select category"
      formControlName="category"
    >
      <mat-option value="BEGINNER"> Beginner</mat-option>
      <mat-option value="INTERMEDIATE"> Intermediate</mat-option>
      <mat-option value="ADVANCED"> Advanced</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Date</mat-label>

    <input
      matInput
      [matDatepicker]="myDatepicker"
      #searchInput
      formControlName="releasedAt"
    />

    <mat-datepicker-toggle
      matIconSuffix
      [for]="myDatepicker"
    >
    </mat-datepicker-toggle>

    <mat-datepicker #myDatepicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field>
    <textarea
      matInput
      placeholder="Description"
      formControlName="longDescription"
    >
    </textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
  <button
    mat-raised-button
    (click)="onClose()"
  >
    Close
  </button>

  <button
    mat-raised-button
    color="primary"
    #saveButton
    (click)="onSave()"
  >
    Save
  </button>
</mat-dialog-actions>
