<div class="course">
  @if (course$ | async; as course) {
    <h2>{{ course?.description }}</h2>

    <img
      class="course-thumbnail"
      [src]="course?.iconUrl"
    />
  }

  <mat-form-field class="search-bar">
    <mat-label>Search by lesson name</mat-label>

    <input
      matInput
      placeholder="Type your search"
      #searchInput
      autocomplete="off"
    />
  </mat-form-field>

  @if (lessons$ | async; as lessons) {
    <table
      mat-table
      [dataSource]="lessons"
    >
      <ng-container matColumnDef="seqNo">
        <th
          mat-header-cell
          *matHeaderCellDef
          >No.</th
        >

        <td
          mat-cell
          *matCellDef="let lesson"
          >{{ lesson.seqNo }}</td
        >
      </ng-container>

      <ng-container matColumnDef="description">
        <th
          mat-header-cell
          *matHeaderCellDef
          >Description</th
        >

        <td
          mat-cell
          *matCellDef="let lesson"
          >{{ lesson.description }}</td
        >
      </ng-container>

      <ng-container matColumnDef="duration">
        <th
          mat-header-cell
          *matHeaderCellDef
          >Duration</th
        >

        <td
          mat-cell
          *matCellDef="let lesson"
          >{{ lesson.duration }}</td
        >
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</div>
